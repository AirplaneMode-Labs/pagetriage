name: publish

# NOBODY ON THE TEAM RUNS THIS WORKFLOW. It exists so that publishing pagetriage is a short list of the owner's own steps (docs/RELEASING.md), and it
# cannot fire by accident (Sprint 7, D2-03; TD-105, TD-121, TD-122, TD-123). Read docs/RELEASING.md before you dispatch it.
#
# How it can be started: workflow_dispatch only, with no inputs, from the main branch of AirplaneMode-Labs/pagetriage only. There is no push, pull request,
# schedule, release or workflow_run trigger, and nothing here is reachable from a fork.
#
# The six locks, all of which must hold before a publish step runs:
#   1. the repository and ref guard on both jobs (this repository, refs/heads/main);
#   2. the `release` environment on the publish job: the owner is its required reviewer, deployments are limited to main and administrators cannot
#      bypass it (the owner configures this; docs/RELEASING.md has the commands). The publish job waits for the owner's approval after the build has
#      finished, which is when the owner checks the candidate and signs it;
#   3. the environment variable RELEASE_PUBLISH_ARMED, which must read 'true' (the owner sets it with --env release only for the minutes a release takes: after
#      the GitHub release exists and just before approving the waiting job, and deletes it afterwards). It is read in the step env of the first step after the
#      checkout, `ARMED: ${{ vars.RELEASE_PUBLISH_ARMED }}`, and never in a job-level `if`: a job-level `if` is evaluated before the job reaches its environment,
#      so it cannot see a variable of the `release` environment (TD-125). No `if:` in this file reads `vars.`;
#   4. the owner's signed manifest, attached to the GitHub release of tag v<version>, verified against the public key committed in docs/release-keys.json
#      (it is empty until the owner adds the real key, so nothing verifies today);
#   5. registry credentials: NPM_TOKEN and CARGO_REGISTRY_TOKEN exist only as secrets of the `release` environment, which the owner creates and revokes
#      (a token of 7 days or less, TD-122); PyPI uses trusted publishing and holds no secret at all;
#   6. RELEASE_KEY_ID, a variable of the `release` environment, equals the one key committed in docs/release-keys.json at the commit being published.
# Then the three bindings: tag v<version> resolves to this commit; the manifest says pagetriage-release, this version and no expiry; no registry holds this
# version yet. Then provenance (an attestation of the exact files). Then publishing, from the exact files the verified manifest lists, never from a glob:
# the crates first, as four consecutive steps (re-package with `cargo package --locked --no-verify`, compare the digests with the signed manifest, `cargo publish
# --locked --no-verify`, read the crates.io sparse index back and compare its cksum with the signed sha256: S1-126, S1-131), then npm, then PyPI. The crates come
# first and before the PyPI step because their pre-publish comparison is the check most likely to refuse (a failure there leaves nothing published anywhere), and
# because pypa/gh-action-pypi-publish is a Docker action that runs as root in the workspace and must not run between the comparison and `cargo publish`.
# The same dist-tag derivation, dry runs and file checks run in CI on every push through scripts/release/rehearse.sh, with the published test key and no
# publish step (scripts/release/publish-dry-run.sh, scripts/release/publish-guard.sh; tests/scripts/publish-guard.sh proves each refusal).
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-pagetriage
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.os }})
    if: github.repository == 'AirplaneMode-Labs/pagetriage' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The same per-OS pins as the rehearsal and the determinism job (run 44580200515): the wheels are built on the Python the hashed tools were compiled for.
        include:
          - os: ubuntu-latest
            python: "3.12.16"
          - os: macos-latest
            python: "3.12.10"
          - os: windows-latest
            python: "3.12.10"
    env:
      TOOLS_BIN: ${{ matrix.os == 'windows-latest' && 'tools-venv/Scripts' || 'tools-venv/bin' }}
      BUILD_SET: ${{ matrix.os == 'ubuntu-latest' && 'all' || 'wheel' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Hashed tool install (uv, maturin, ziglang) into a venv
        run: |
          python -m venv tools-venv
          "$TOOLS_BIN/python" -m pip install --require-hashes --no-deps --only-binary=:all: -r tools/ci/requirements.txt
          "$TOOLS_BIN/maturin" --version
      - name: Install pinned wasm-bindgen CLI and wasm-opt (digest-pinned release binaries; the Linux leg builds the tarball)
        if: matrix.os == 'ubuntu-latest'
        run: scripts/install-wasm-tools.sh
      - name: Build the candidate artefacts (the Linux leg builds the tarball, the wheel, the sdist and the crates; the others build their wheel)
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          bash scripts/release/build-artefacts.sh
      - name: Print the candidate digests (the owner compares these before signing)
        run: |
          node -e 'const fs=require("fs"),c=require("crypto");for(const n of fs.readdirSync("dist-release").sort()){const b=fs.readFileSync("dist-release/"+n);console.log(c.createHash("sha256").update(b).digest("hex")+"  "+n+"  "+b.length+" bytes")}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pagetriage-candidate-${{ matrix.os }}
          path: dist-release/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false

  publish:
    name: publish
    needs: build
    if: github.repository == 'AirplaneMode-Labs/pagetriage' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # lock 3 (TD-125): the variable of the release environment, read in a step (never in an `if`), the first step after the checkout
      - name: Lock 3, the release is armed (RELEASE_PUBLISH_ARMED reads true)
        env:
          ARMED: ${{ vars.RELEASE_PUBLISH_ARMED }}
        run: bash scripts/release/publish-guard.sh armed
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      # lock 6: the key id the owner set in the environment is the one committed key
      - name: Lock 6, RELEASE_KEY_ID equals the single key in docs/release-keys.json
        env:
          RELEASE_KEY_ID: ${{ vars.RELEASE_KEY_ID }}
        run: bash scripts/release/publish-guard.sh key-id
      - name: Read the version from Cargo.toml at this commit (validated, never interpolated into a command)
        run: |
          VERSION=$(bash scripts/release/publish-guard.sh version)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DIST_TAG=$(bash scripts/release/publish-guard.sh dist-tag "$VERSION")" >> "$GITHUB_ENV"
      # binding 1: the tag v<version> resolves to the commit this run publishes
      - name: Binding 1, tag v<version> peels to this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_REPO: ${{ github.repository }}
          GUARD_SHA: ${{ github.sha }}
        run: GUARD_VERSION="$VERSION" bash scripts/release/publish-guard.sh tag-binding
      # binding 3 (read-only lookups; only a 404 passes): no registry holds this version
      - name: Binding 3, npm, PyPI and crates.io do not hold this version yet
        run: GUARD_VERSION="$VERSION" bash scripts/release/publish-guard.sh registry-absent
      # the candidates built by the build job of THIS run, and the owner's signed manifest from the GitHub release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pagetriage-candidate-*
          merge-multiple: true
          path: candidate
      - name: Fetch the owner's signed manifest from the GitHub release of tag v<version>
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_REPO: ${{ github.repository }}
        run: |
          mkdir signed
          gh release download "v$VERSION" --repo "$GUARD_REPO" --pattern release-manifest.json --dir signed
          test "$(ls -A signed)" = "release-manifest.json"
      - name: Assemble the verify directory (the candidate files, the signed manifest, SHA256SUMS of those files)
        run: |
          mkdir verified
          cp -R candidate/. verified/
          cp signed/release-manifest.json verified/release-manifest.json
          node scripts/release/release-tool.mjs sums --dir verified
      # lock 4: the signature, the id, the artefact hashes and sizes, and SHA256SUMS, against the committed release keys
      - name: Lock 4, verify the signed manifest against docs/release-keys.json
        run: node scripts/release/release-tool.mjs verify --dir verified --expect-id pagetriage-release --trust-file docs/release-keys.json
      - name: Binding 2, the manifest says pagetriage-release, this version, no expiry
        run: GUARD_VERSION="$VERSION" bash scripts/release/publish-guard.sh manifest-binding verified/release-manifest.json
      - name: The verified set is exactly the expected files, and the exact per-registry lists
        run: GUARD_VERSION="$VERSION" bash scripts/release/publish-guard.sh exact-set verified lists
      - name: Exact paths of the verified artefacts (no glob)
        id: exact
        run: |
          {
            echo "paths<<EOF_PATHS"
            sed 's|^|verified/|' lists/all.txt
            echo "EOF_PATHS"
          } >> "$GITHUB_OUTPUT"
      # provenance: after the signed-manifest verification and the exact-set check, and before the first publish step (the crate comparison sits with the
      # crate publish, four steps in a row; an attestation names files that were built and signed, not files that were published)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.exact.outputs.paths }}
      # the crates: four consecutive steps (S1-126, S1-131). Verification (building each crate from its tarball) already ran in the build job and in every
      # release-rehearsal leg, so both cargo commands say --no-verify; the rehearsal logs that the --no-verify bytes equal the verified bytes.
      - name: Crates 1 of 4, re-package pagetriage-core and pagetriage-cli at this commit
        run: cargo package --locked --no-verify -p pagetriage-core -p pagetriage-cli
      - name: Crates 2 of 4, the re-packaged digests equal the sha256 the owner signed
        run: GUARD_VERSION="$VERSION" bash scripts/release/publish-guard.sh crate-digests verified target/package
      - name: Crates 3 of 4, publish the crates (core, then cli, in one invocation; the publish = false crates are not named)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --no-verify -p pagetriage-core -p pagetriage-cli
      - name: Crates 4 of 4, the crates.io sparse index lists both crates with the signed cksum (retried for up to 10 minutes; a different cksum fails the job)
        run: GUARD_VERSION="$VERSION" bash scripts/release/publish-guard.sh index-check verified
      - name: Publish the npm package (provenance, public, no install scripts, a derived dist-tag)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # a leading ./ is required: npm reads "verified/x.tgz" as a GitHub owner/repo shorthand (found by the dry run, 20 Nov 2026)
        run: npm publish "./verified/$(cat lists/npm.txt)" --provenance --access public --ignore-scripts --tag "$DIST_TAG"
      - name: Stage exactly the PyPI files (the sdist and the three wheels)
        run: |
          mkdir pypi-dist
          while IFS= read -r f; do cp "verified/$f" "pypi-dist/$f"; done < lists/pypi.txt
          test "$(ls -A pypi-dist | wc -l | tr -d ' ')" = "$(wc -l < lists/pypi.txt | tr -d ' ')"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: pypi-dist/
          attestations: true
