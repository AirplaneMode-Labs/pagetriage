# OpenSSF Scorecard: an automated review of the repository's security practices (branch protection,
# pinned dependencies, token permissions, ...). Results appear in the Security tab and at
# https://securityscorecards.dev/viewer/?uri=github.com/AirplaneMode-Labs/pagetriage. Free for public repos.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 2"

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      # Required by ossf/scorecard-action: contents and actions to read the repository and its
      # workflow runs, security-events to upload the SARIF, id-token to publish signed results.
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: results.sarif
