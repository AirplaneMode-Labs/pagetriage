name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Default members: core + cli. Includes the golden snapshots and the schema drift test.
      - run: cargo test --locked
      # Shell tests for the scripts CI depends on (stubbed curl and uname: no network, nothing installed).
      - name: Script tests
        run: bash tests/scripts/run-all.sh

  # Rustdoc with warnings denied (BUG-T2-S4-22): a broken intra-doc link, a link to a private item or bare
  # HTML in a doc comment fails here and not on docs.rs. Same command as the local check; Linux only.
  doc:
    name: cargo doc -D warnings
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

  # The determinism gate: golden inputs must give byte-identical reports on native, Python and WASM,
  # on Linux, macOS and Windows, and the WASM build must stay inside its gzip size budget.
  # Windows uses the Windows branch of scripts/install-wasm-tools.sh (pinned digests); first green
  # Windows run on 9 Nov 2026.
  determinism:
    name: determinism + bench tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # One exact CPython 3.12 per OS (run 44580200515), the same three pins as the wheels job; why they differ is at the
        # setup-python step below.
        include:
          - os: ubuntu-latest
            python: "3.12.16"
          - os: macos-latest
            python: "3.12.10"
          - os: windows-latest
            python: "3.12.10"
    env:
      PYTHON: ${{ matrix.os == 'windows-latest' && 'python' || 'python3' }}
      BENCH_VENV_BIN: ${{ matrix.os == 'windows-latest' && '.venv/Scripts' || '.venv/bin' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # An exact Python per OS (S1-117): the hashed requirements below name the wheels of numpy and Pillow for CPython 3.12 on the
      # three runners, and setup-python's "3.12" would follow whatever patch release it finds. The patch release differs by OS
      # because no single one exists on all three images (run 44580200515; actions/python-versions versions-manifest.json, read
      # 19 Nov 2026): 3.12.10 is the last CPython 3.12 with a macOS or Windows build, and the ubuntu-26.04 image behind
      # ubuntu-latest has 3.12.13 and newer only. The cp312 wheel tags, and so the hashes, do not depend on the patch release.
      # When ubuntu-latest moves to a newer image, this step fails with "was not found for Ubuntu": read the manifest again, pick
      # an exact 3.12.z (or the next Python, with new hashes) and change the pins in the determinism and wheels jobs together;
      # tests/scripts/ci-policy.sh checks both.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install pinned wasm-bindgen CLI and wasm-opt
        run: scripts/install-wasm-tools.sh
      - name: Determinism gate (native, Python, WASM) and WASM size budget
        run: scripts/determinism.sh
      # The same command the pages workflow runs, so a demo that fails to build fails CI.
      - name: Demo site build and sample fingerprint check
        run: scripts/build-site.sh
      # numpy and Pillow from the hashed file, binary wheels only, no dependency resolution (S1-117, S1-079). Known gap:
      # the maturin that scripts/determinism.sh installs into .venv (the step above) is pinned by version only; this job
      # builds no shipped artefact and uses no secrets.
      - name: Bench harness tests (offline; includes run.py against the golden reports), numpy and Pillow installed by hash
        run: |
          "$BENCH_VENV_BIN/python" -m pip install --require-hashes --no-deps --only-binary=:all: -r tools/ci/requirements-determinism.txt
          "$BENCH_VENV_BIN/python" -I -m unittest discover -s bench/tests -v

  # The release rehearsal (TD-103, TD-106, Sprint 7), one job per OS. It replaced the `wheels` job of TD-09, which it contains: the
  # wheel on each OS (manylinux_2_17 through zig on Linux) and, on Linux, the sdist and a wheel built from the sdist alone.
  # Beyond that it builds the npm tarball (the PDF-enabled WebAssembly build), the command-line binary and the two crates
  # (`cargo package --workspace --locked`, run twice: the .crate bytes must be identical, S1-126), installs each BUILT artefact into an
  # empty project or a fresh venv, offline, and makes one real call on a synthetic golden page whose output is byte-equal to its
  # golden report (the CLI is built from the packaged .crate files, with third-party crates from a `cargo vendor --locked` directory
  # source, `cargo install --offline --locked`, so no '-core' crate can come from crates.io). Then it signs a pagetriage-rehearsal
  # manifest and SHA256SUMS with the published RFC 8032 TEST key through the vendored release tool, verifies it with the explicit
  # test-key flag, and proves the refusals (no flag, the empty production key file, a missing --expect-id, a release id, a tampered
  # artefact, CRLF in SHA256SUMS) by exact exit code and first stderr line; a self-test points the script at a missing tool and
  # expects the rehearsal to fail. The README quick start (tests/scripts/quickstart.sh) then runs from those artefacts.
  # Every tool is installed by hash (S1-079): uv, maturin and ziglang from tools/ci/requirements.txt with
  # `pip install --require-hashes --no-deps --only-binary=:all:`, on an exact Python per OS; cargo and maturin run with --locked.
  # The job has contents: read and nothing else (no id-token, no attestations), uses no cache of any kind and no secret, and has no
  # registry, release or Pages step. Its artefact is named REHEARSAL-test-key-NOT-A-RELEASE-..., holds only dist-release/ and
  # dist-release-report/, and is kept for 3 days: it is not a release and nothing signed here is trusted anywhere.
  # First run: after the owner's push (the Linux and Windows legs cannot run on the Mac that develops this repository).
  release-rehearsal:
    name: release-rehearsal (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The same per-OS pins as the determinism job (run 44580200515); the reason is at its setup-python step.
        include:
          - os: ubuntu-latest
            python: "3.12.16"
          - os: macos-latest
            python: "3.12.10"
          - os: windows-latest
            python: "3.12.10"
    env:
      TOOLS_BIN: ${{ matrix.os == 'windows-latest' && 'tools-venv/Scripts' || 'tools-venv/bin' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The toolchain is complete before the first cargo call: the components and targets are the ones rust-toolchain.toml lists, so no
      # cargo call starts a rustup implicit install (run 44651022212: rustup's top-up of clippy and rustfmt died with 'detected conflict:
      # bin/cargo-clippy' at the first cargo call on ubuntu-latest and macos-latest). tests/scripts/ci-policy.sh (check H) holds every
      # dtolnay step of every workflow to the same three values.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Hashed tool install (uv, maturin, ziglang) into a venv
        run: |
          python -m venv tools-venv
          "$TOOLS_BIN/python" -m pip install --require-hashes --no-deps --only-binary=:all: -r tools/ci/requirements.txt
          "$TOOLS_BIN/maturin" --version
      - name: Install pinned wasm-bindgen CLI and wasm-opt (digest-pinned release binaries)
        run: scripts/install-wasm-tools.sh
      - name: Build the artefacts (npm tarball, wheel, CLI; Linux also the sdist and a wheel from the sdist alone; crates packaged twice, byte-identical)
        run: bash scripts/release/rehearse.sh build
      - name: Install each built artefact into an empty project, offline, and make one real call (the CLI from the packaged crates)
        run: bash scripts/release/rehearse.sh install
      - name: Release rehearsal with the published TEST key (manifest, SHA256SUMS, sign, verify, exact refusal proofs, missing-tool self-test)
        run: bash scripts/release/rehearse.sh sign
      - name: Gate (dist-release holds only the manifest entries and the two files; no key material, no builder path, no plain release version)
        run: bash scripts/release/rehearse.sh gate
      - name: README quick start (its blocks are extracted and run from the built artefacts, in a scrubbed environment)
        run: QUICKSTART_RUN=1 QUICKSTART_REUSE=1 bash tests/scripts/quickstart.sh
      - name: Dry run of the publish commands (package metadata, wheel check, workspace packaging); nothing is published
        run: bash scripts/release/publish-dry-run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: REHEARSAL-test-key-NOT-A-RELEASE-pagetriage-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist-release/
            dist-release-report/
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: false

  # Packaging dry runs: the npm tarball and the Python wheel are built, installed in a scratch project,
  # and run. Nothing is published from CI (docs/RELEASING.md).
  packaging:
    name: packaging dry runs (npm tarball, Python wheel, crate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install pinned wasm-bindgen CLI and wasm-opt
        run: scripts/install-wasm-tools.sh
      - run: scripts/build-wasm.sh
      - name: npm tarball installs and runs under Node
        run: scripts/package-npm.sh
      - name: Python wheel installs and runs in a fresh virtual environment
        run: scripts/package-python.sh
      - name: Core crate packages and builds from its tarball
        run: cargo package --locked -p pagetriage-core

  # Dependency policy (deny.toml). cargo-deny is a pinned release binary checked against a SHA-256 kept
  # in this file, not the EmbarkStudios Docker action. Linux only. The advisories leg may fail without
  # blocking: a new advisory is information, a licence, ban or source violation is not.
  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, "bans licenses sources"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: cargo-deny 0.20.2 (digest-pinned binary)
        env:
          CHECKS: ${{ matrix.checks }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/cargo-deny.tgz" https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/cargo-deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-deny.tgz" --strip-components=1 -C "$RUNNER_TEMP/bin"
          # CHECKS holds one fixed matrix value ('advisories' or 'bans licenses sources'); the shell splits it into the check names
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/bin/cargo-deny" --all-features check $CHECKS
