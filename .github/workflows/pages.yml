name: pages

# Builds the demo site and deploys it to GitHub Pages at https://airplanemode-labs.github.io/pagetriage/.
# scripts/build-site.sh fails the run when the WASM build does not reproduce the native report
# fingerprints committed in site/samples/samples.json, so a broken determinism claim never reaches
# the public page.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "crates/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build site (WASM + sample check)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install pinned wasm-bindgen CLI and wasm-opt
        run: scripts/install-wasm-tools.sh
      - name: Build the WASM package and check it reproduces every native fingerprint
        run: scripts/build-site.sh
      - name: Assemble the site (site/ without tools/, scratch files and the manifest's generator)
        run: |
          rm -rf _site
          rsync -a --exclude 'tools/' --exclude '.gitignore' --exclude '.DS_Store' --exclude '__pycache__/' site/ _site/
          ls -la _site _site/pkg
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
