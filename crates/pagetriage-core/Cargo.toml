[package]
name = "pagetriage-core"
description = "Deterministic, non-ML page-content analyser for degraded scanned legal documents (core crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = []
# PDF structural layer (modules M1, M2 and the structure part of M12): parses PDF files with
# `lopdf`. Off by default so the pixel-only build (and its WASM size) does not carry a PDF parser.
# `lopdf` is built without its default features (no rayon threads, no clock), see
# docs/detectors/text_layer.md for why `pdf-inspector` is not used.
pdf = ["dep:lopdf", "dep:flate2", "dep:weezl"]

[dependencies]
libm = "0.2.16"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = "1.2.1"

# Stream accounting (S1-107, TD-70, TD-86): streaming decoders that count decoded bytes without
# keeping them. Both crates are already in Cargo.lock, pulled in by `lopdf` (flate2 1.1.10 with its
# miniz_oxide backend, weezl 0.2.1); they are made direct at exactly the locked versions, with the
# same features lopdf asks for, so the dependency tree gains no package (`cargo tree` before and
# after is in docs/detectors/streams.md). Both compile to wasm32-unknown-unknown.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"], optional = true }
weezl = { version = "=0.2.1", default-features = false, features = ["std"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { version = "0.47.0", default-features = false, optional = true }

# On wasm32-unknown-unknown lopdf's `getrandom` needs the `wasm_js` backend to compile at all.
# The built module therefore imports `crypto.getRandomValues` (docs/wasm-api.md: one call was seen
# over the sample PDFs); the reports do not depend on it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
lopdf = { version = "0.46.0", default-features = false, features = ["wasm_js"], optional = true }

[dev-dependencies]
jsonschema = { version = "0.61.2", default-features = false }

# Writes the synthetic stream bombs of tests/streams.rs for scripts/stream-bombs.sh (never committed).
[[example]]
name = "gen_stream_bombs"
required-features = ["pdf"]
